# First phase of the reviewed Goldberg x64 build workflow.
# This intentionally performs SOURCE PREPARATION ONLY; no DLL compilation.
# Keep GitHub Actions disabled until the complete workflow has been reviewed.
name: Reviewed GBE x64 (preflight only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Verify and prepare reviewed source
    if: github.ref == 'refs/heads/security-hardening'
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out the reviewed repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Stage verified Windows tools and original source packages
        shell: pwsh
        run: '& ./scripts/stage-reviewed-build-tools.ps1'

      - name: Extract reviewed sources and apply libssq patch
        shell: pwsh
        run: '& ./scripts/prepare-reviewed-sources.ps1'

      - name: Verify and stage reviewed Abseil source
        shell: pwsh
        run: '& ./scripts/stage-reviewed-abseil.ps1'

      - name: Check prepared dependency layout
        shell: pwsh
        run: |
          $root = 'build/deps/win/vs2022'
          foreach ($item in @(
            "$root/libssq/src/query.c",
            "$root/protobuf/CMakeLists.txt",
            "$root/abseil/CMakeLists.txt",
            "$root/curl/CMakeLists.txt",
            "$root/mbedtls/CMakeLists.txt"
          )) {
            if (-not (Test-Path -LiteralPath $item -PathType Leaf)) {
              throw "Missing prepared source: $item"
            }
          }
          Write-Host 'Reviewed source preflight complete. No libraries or DLLs compiled.'

      - name: Build reviewed Zlib x64 only
        shell: pwsh
        run: '& ./scripts/build-reviewed-zlib-x64.ps1'

      - name: Build reviewed Mbed TLS x64 only
        shell: pwsh
        run: '& ./scripts/build-reviewed-mbedtls-x64.ps1'

      - name: Inspect reviewed Mbed TLS support archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vsRoot = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC'
          $libExe = Get-ChildItem -LiteralPath $vsRoot -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'bin\Hostx64\x64\lib.exe' } |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1

          if (-not $libExe) {
            throw 'Microsoft x64 lib.exe not found.'
          }

          $outDir = Join-Path $env:GITHUB_WORKSPACE 'build\deps\win\vs2022\mbedtls\install64\lib'

          foreach ($name in @('everest.lib', 'p256m.lib')) {
            $archive = Join-Path $outDir $name

            if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
              throw "Missing support library: $archive"
            }

            Write-Host "Inspecting archive: $name"

            $listing = @(& $libExe /LIST $archive 2>&1)
            $exitCode = $LASTEXITCODE

            $listing | ForEach-Object { Write-Host $_ }

            if ($exitCode -ne 0) {
              throw "Library inspection failed: $name (exit $exitCode)"
            }

            $objects = @($listing | Where-Object { $_ -match '(?i)\.obj\s*$' })

            Write-Host "Object member count: $($objects.Count)"

            if ($objects.Count -eq 0) {
              throw "No compiled object members found in $name"
            }
          }

          Write-Host 'Supporting-library archive inspection passed.'

      - name: Examine Mbed TLS support archive headers and symbols
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vsRoot = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC'
          $dumpbin = Get-ChildItem -LiteralPath $vsRoot -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'bin\Hostx64\x64\dumpbin.exe' } |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1

          if (-not $dumpbin) {
            throw 'Microsoft dumpbin.exe not found.'
          }

          $outDir = Join-Path $env:GITHUB_WORKSPACE 'build\deps\win\vs2022\mbedtls\install64\lib'

          foreach ($name in @('everest.lib', 'p256m.lib')) {
            $archive = Join-Path $outDir $name

            if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
              throw "Missing library: $archive"
            }

            Write-Host "===== HEADERS: $name ====="
            & $dumpbin /HEADERS $archive

            if ($LASTEXITCODE -ne 0) {
              throw "Header inspection failed: $name"
            }

            Write-Host "===== LINKER SYMBOLS: $name ====="
            & $dumpbin /LINKERMEMBER:2 $archive

            if ($LASTEXITCODE -ne 0) {
              throw "Symbol inspection failed: $name"
            }
          }

          Write-Host 'Mbed TLS support archive diagnostics completed.'

      - name: Build reviewed Curl x64 only
        shell: pwsh
        run: '& ./scripts/build-reviewed-curl-x64.ps1'

      - name: Inspect reviewed Curl x64 static archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vsRoot = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC'
          $toolDir = Get-ChildItem -LiteralPath $vsRoot -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'bin\Hostx64\x64' } |
            Where-Object {
              (Test-Path -LiteralPath (Join-Path $_ 'lib.exe')) -and
              (Test-Path -LiteralPath (Join-Path $_ 'dumpbin.exe'))
            } |
            Select-Object -First 1

          if (-not $toolDir) {
            throw 'Microsoft x64 archive inspection tools not found.'
          }

          $libExe = Join-Path $toolDir 'lib.exe'
          $dumpbin = Join-Path $toolDir 'dumpbin.exe'

          $archive = Join-Path $env:GITHUB_WORKSPACE 'build\deps\win\vs2022\curl\install64\lib\libcurl.lib'

          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw 'Installed Curl archive missing.'
          }

          $members = @(& $libExe /LIST $archive 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw 'Curl archive member inspection failed.'
          }

          $objects = @($members | Where-Object { $_ -match '(?i)\.obj\s*$' })
          Write-Host "Curl object member count: $($objects.Count)"

          if ($objects.Count -eq 0) {
            throw 'Curl archive contains no recognized object members.'
          }

          $headers = @(& $dumpbin /HEADERS $archive 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw 'Curl archive header inspection failed.'
          }

          $machines = @($headers | Where-Object {
            $_ -match '^\s*[0-9A-Fa-f]{4}\s+machine\s+\('
          })

          Write-Host "Object architecture header count: $($machines.Count)"

          if ($machines.Count -eq 0 -or
              @($machines | Where-Object {
                $_ -notmatch '^\s*8664\s+machine\s+\(x64\)'
              }).Count -ne 0) {
            throw 'Missing or unexpected object architecture.'
          }

          $symbols = @(& $dumpbin /LINKERMEMBER:2 $archive 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw 'Curl symbol inspection failed.'
          }

          foreach ($name in @('curl_easy_init', 'curl_easy_perform')) {
            if (-not @($symbols | Where-Object {
              $_ -match "\b$([regex]::Escape($name))\b"
            }).Count) {
              throw "Expected Curl API symbol not found: $name"
            }
            Write-Host "Found Curl API symbol: $name"
          }

          Write-Host 'Curl x64 static archive inspection passed.'
